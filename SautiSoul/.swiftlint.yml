# SwiftLint Configuration for Sauti Soul

# Disabled rules
disabled_rules:
  - trailing_whitespace  # We'll handle this with formatter
  - line_length          # Allow longer lines for readability

# Opt-in rules
opt_in_rules:
  - empty_count
  - force_unwrapping
  - implicitly_unwrapped_optional
  - operator_usage_whitespace
  - overridden_super_call
  - prohibited_super_call
  - redundant_nil_coalescing
  - single_test_class
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call

# Included paths
included:
  - SautiSoul

# Excluded paths
excluded:
  - Pods
  - build
  - DerivedData
  - .build

# File length
file_length:
  warning: 500
  error: 1000

# Function length
function_body_length:
  warning: 50
  error: 100

# Type body length
type_body_length:
  warning: 300
  error: 500

# Nested types depth
nesting:
  type_level: 2
  function_level: 3

# Identifier names
identifier_name:
  min_length: 2
  max_length: 60
  excluded:
    - id
    - x
    - y
    - z

# Force casting
force_cast: warning
force_try: warning

# Statement position
statement_position:
  severity: warning

# Trailing closure
trailing_closure: warning

# Colon spacing
colon:
  flexible_right_spacing: false
  apply_to_dictionaries: true

# Comma spacing
comma: error

# Operator spacing
operator_whitespace: error

# Return arrow whitespace
return_arrow_whitespace: error

# Vertical whitespace
vertical_whitespace:
  max_empty_lines: 2

